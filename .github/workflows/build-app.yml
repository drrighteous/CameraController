name: Build App

on:
  workflow_dispatch:

jobs:
  build:
    name: Build ArtificeLens
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Resolve packages
        run: |
          xcodebuild \
            -project ArtificeLens.xcodeproj \
            -scheme ArtificeLens \
            -resolvePackageDependencies

      - name: Build release app without signing
        run: |
          xcodebuild \
            -project ArtificeLens.xcodeproj \
            -scheme ArtificeLens \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent ArtificeLens.app "$GITHUB_WORKSPACE/ArtificeLens-${GITHUB_REF_NAME}-unsigned.zip"
          shasum -a 256 "$GITHUB_WORKSPACE/ArtificeLens-${GITHUB_REF_NAME}-unsigned.zip" > "$GITHUB_WORKSPACE/ArtificeLens-${GITHUB_REF_NAME}-unsigned.zip.sha256"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtificeLens-${{ github.ref_name }}-unsigned
          path: |
            ArtificeLens-${{ github.ref_name }}-unsigned.zip
            ArtificeLens-${{ github.ref_name }}-unsigned.zip.sha256
